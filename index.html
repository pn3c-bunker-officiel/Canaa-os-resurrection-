<!DOCTYPE html><html lang=fr><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=color-scheme content=light><title>CANAA-OS Blanc Or</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel=stylesheet><style>html{color-scheme:light}:root{--gold:#b8965a;--gd:#7a5e33;--bg:#fefcf6;--card:#ffffff;--bd:#efdfbe;--txt:#1e293b;--mut:#8b8b8b;--red:#ef4444}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg)!important;color:var(--txt)!important;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:120px}.top{position:sticky;top:0;z-index:20;background:var(--card)!important;border-bottom:1.5px solid var(--bd);padding:12px 14px;display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;letter-spacing:.5px;color:var(--gd)}.logo span{color:var(--gold)}.topIcons{display:flex;gap:14px;align-items:center}.iconBtn{width:34px;height:34px;border-radius:50%;background:#fdf6e3;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;position:relative}.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:8px;font-weight:800;padding:2px 5px;border-radius:10px}.stories{padding:14px 0 10px 14px;background:var(--card)!important;border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.sec{font-size:10px;font-weight:800;letter-spacing:1.2px;color:var(--gd);margin:0 14px 10px;display:flex;justify-content:space-between}.story{display:inline-block;text-align:center;margin-right:14px;cursor:pointer;vertical-align:top}.av{width:62px;height:62px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#c9a86a,#e8d5a3,#b8965a);display:flex;align-items:center;justify-content:center;position:relative}.av div{width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff}.plus{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;background:var(--gold);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid #fff}.story span{font-size:9px;font-weight:600;margin-top:4px;display:block;color:#374151}.feed{padding:10px 0}.post{background:var(--card)!important;margin:0 10px 14px;border-radius:18px;border:1.5px solid var(--bd);overflow:hidden;box-shadow:0 2px 14px rgba(184,150,90,.07)}.ph{display:flex;align-items:center;gap:10px;padding:12px 14px}.phAv{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#c9a86a,#b8965a);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}.phInfo b{font-size:12px}.phInfo div{font-size:9px;color:var(--mut)}.postImg{width:100%;height:200px;object-fit:cover;background:#f3f4f6;display:block}.postActions{display:flex;gap:16px;padding:10px 14px;align-items:center}.act{font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:600;color:#374151}.caption{padding:0 14px 10px;font-size:11.5px;line-height:1.45;color:#334155}.tag{color:var(--gd);font-weight:700}.commentBubble{background:#fdf6e3;border:1px solid var(--bd);border-radius:16px 16px 16px 4px;padding:8px 12px;margin:0 14px 12px;display:inline-block;font-size:11px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.97)!important;backdrop-filter:blur(12px);border-top:1.5px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 18px;z-index:40}.ni{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:700;color:#9ca3af;cursor:pointer;gap:2px}.ni.ac{color:var(--gd)}.niCenter{width:52px;height:52px;background:linear-gradient(135deg,#c9a86a,#b8965a);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;box-shadow:0 6px 18px rgba(184,150,90,.4);margin-top:-6px}.alertFloat{position:fixed;bottom:88px;right:14px;z-index:45;background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;padding:12px 18px;border-radius:30px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(239,68,68,.4);cursor:pointer;animation:pu 2s infinite;border:2px solid #fff}.meshBar{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:#1f2937;color:#fde68a;padding:8px 12px;border-radius:12px;font-size:8px;font-weight:700;display:flex;justify-content:space-between;align-items:center;z-index:41;border:1px solid #444}.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:90}.mo.op{display:flex}.mox{background:#fff!important;width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow-y:auto}.mc{margin-top:14px;width:100%;padding:12px;background:#1f2937;color:#fff;border:none;border-radius:12px;font-weight:700}@keyframes pu{0%,100%{box-shadow:0 8px 24px rgba(239,68,68,.4)}50%{box-shadow:0 8px 24px rgba(239,68,68,.4),0 0 0 12px rgba(239,68,68,.12)}}.liveVideo{width:100%;border-radius:14px;background:#000;max-height:220px;margin-top:10px}
</style></head><body><div class=top><div class=logo>✨<span>CANAA</span>-OS</div><div class=topIcons><div class=iconBtn onclick="om('search')">🔍</div><div class=iconBtn onclick="om('chat')">💬<div class=badge>3</div></div></div></div><div class=sec><span>STORIES</span><span style="cursor:pointer" onclick="om('story')">+ Ton statut +</span></div><div class=stories id=stories></div><div class=sec style="margin-top:12px"><span>FEED</span><span style="font-weight:400;color:var(--mut)">11 Eglises • Live</span></div><div class=feed id=feed></div><div class=alertFloat onclick="om('ale')">🔔 ALERT</div><div class=meshBar><div><b>MODE MESH ACTIF —</b><br>3 personnes connectees a proximite • Messages hors ligne synchronises</div><div style="font-size:16px">🌐</div></div><div class=nav><div class="ni ac" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span style="font-size:18px">🏠</span>Feed</div><div class=ni onclick="om('chat')"><span style="font-size:18px">💬</span>Chats<div class=badge style="position:relative;top:-18px;left:12px">3</div></div><div class=ni onclick="om('live')"><div class=niCenter>+</div>Créer</div><div class=ni onclick="om('mesh')"><span style="font-size:18px">🕸️</span>Mesh</div><div class=ni onclick="om('pro')"><span style="font-size:18px">👤</span>Profil</div></div><div id=mo class=mo onclick="if(event.target.id=='mo')cm()"><div class=mox><h3 id=mt style="font-family:'Playfair Display',serif"></h3><div id=mx style="font-size:13px;color:#374151;line-height:1.6;margin-top:10px"></div><div id=ex></div><button class=mc onclick="cm()">Fermer</button></div></div>
<script>
let TM=parseInt(localStorage.getItem('canaa_total')||'3248'),TA=parseInt(localStorage.getItem('canaa_alertes')||'3');
const users=[{n:'Toi',e:'👑',me:true},{n:'Koffi',e:'🧢'},{n:'Aicha',e:'🧕'},{n:'Yao',e:'👦🏾'},{n:'Mariame',e:'👩🏾'},{n:'Past.',e:'✝️'}];
function renderStories(){let c=document.getElementById('stories');c.innerHTML=users.map(u=>`<div class=story onclick="om('story')"><div class=av><div>${u.e}</div>${u.me?'<div class=plus>+</div>':''}</div><span>${u.n}</span></div>`).join('');}
const posts=[{user:'Sékou | Abidjan',loc:'Plateau • Abidjan',time:'il y a 12min',img:'https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=600',likes:'1.2k',com:'89',share:'34',cap:'Le nouveau spot au Plateau 🔥 Les gars on se retrouve ce soir pour le cypher! #Abidjan #Jeunesse #CANAAOS',reply:'Marie: Je suis en route, 10min'},{user:'Team Flow 225',loc:'Yopougon • il y a 34min',time:'',img:'https://images.unsplash.com/photo-1516450360452-9312abbf6f7e?w=600',likes:'842',com:'63',share:'28',cap:'Nouveau beat en ligne 🎧 qui veut le freestyle? #TrapCi #Ivoirien',reply:''},{user:'Ministere Resurrection',loc:'Cocody • il y a 1h',time:'',img:'https://images.unsplash.com/photo-1504052434569-70ad5836ab65?w=600',likes:'2.1k',com:'120',share:'95',cap:'Enseignement du jour 📖 Business saint = benediction sans chagrin. Charte Sainte active! #CANAAOS #BlancOr',reply:'Prophete: Amen 🙏'}];
function renderFeed(){let f=document.getElementById('feed');f.innerHTML=posts.map(p=>`<div class=post><div class=ph><div class=phAv>${p.user[0]}</div><div class=phInfo><b>${p.user} ${p.user.includes('Sékou')?'✅':''}</b><div>${p.loc}${p.time?' • '+p.time:''}</div></div><div style="margin-left:auto">⋯</div></div><img class=postImg src="${p.img}" alt=""><div class=postActions><div class=act onclick="like(this)">🤍 ${p.likes}</div><div class=act>💬 ${p.com}</div><div class=act>↗️ ${p.share}</div></div><div class=caption>${p.cap.replace(/#\w+/g,m=>`<span class=tag>${m}</span>`)}</div>${p.reply?`<div class=commentBubble>${p.reply} ↗️</div>`:''}</div>`).join('')+`<div class=post><div class=ph><div class=phAv style="background:linear-gradient(135deg,#b8965a,#c9a86a)">📜</div><div class=phInfo><b>Charte Sainte CANAA-OS</b><div>Epingle • Blanc Or</div></div></div><div style="padding:12px 14px;font-size:11px;line-height:1.5;background:#fdf6e3"><b style="color:#7a5e33">✅ Business saint autorise</b> • vetements decents, nourriture, artisanat<br><b style="color:#991b1b">❌ Interdit = BAN</b> • eclaircissant, tenue denudee, alcool, drogue, fetiche<br><br><i>Canaa est terre sainte. On ne vend pas le monde ici.</i></div></div>`;}
function like(el){el.innerHTML='❤️ '+el.textContent.split(' ')[1];}
const D={search:{t:'🔍 Recherche CANAA-OS',m:()=>'Recherche parmi les 11 eglises...<br><br><input style="width:100%;padding:12px;border:1.5px solid #efdfbe;border-radius:12px" placeholder="Rechercher...">'},chat:{t:'💬 Chats - 3 nouveaux',m:()=>['Koffi','Aicha','Team Flow 225'].map(n=>`<div style="padding:12px;border:1px solid #efdfbe;border-radius:12px;margin-top:8px;display:flex;gap:10px"><div style="width:36px;height:36px;background:#fdf6e3;border-radius:50%;display:flex;align-items:center;justify-content:center">👤</div><div><b style="font-size:12px">${n}</b><div style="font-size:10px;color:#6b7280">Nouveau message • il y a 2min</div></div></div>`).join('')},story:{t:'✨ Stories',m:()=>`<b>Ajoute ton statut</b><br>Partage un moment sous charte sainte<br><br><div style="background:#fdf6e3;border:2px dashed #d4b778;padding:20px;border-radius:14px;text-align:center">📸<br>Clique pour ajouter photo/video</div>`,x:'<button onclick="alert(\'Story ajoutee en Blanc Or ✅\')" style="width:100%;padding:12px;background:linear-gradient(135deg,#c9a86a,#b8965a);color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:12px">Publier Story</button>'},live:{t:'📡 Creer - Live / Post',m:()=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div onclick="om('liveCam')" style="background:linear-gradient(135deg,#c9a86a,#b8965a);color:#fff;padding:16px;border-radius:14px;text-align:center;cursor:pointer"><div style="font-size:20px">📡</div><b style="font-size:11px">LIVE</b></div><div onclick="om('post')" style="background:#fff;border:1.5px solid #efdfbe;padding:16px;border-radius:14px;text-align:center;cursor:pointer"><div style="font-size:20px">📝</div><b style="font-size:11px">POST</b></div></div><video id=liveVid class=liveVideo autoplay muted playsinline style="display:none"></video><div id=liveStatus style="font-size:11px;margin-top:8px"></div>`,x:'<button onclick="startLive()" style="width:100%;padding:12px;background:#b8965a;color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:10px">Activer Camera 🔴</button>'},liveCam:{t:'📡 LIVE - Sous Charte',m:()=>`<div style="background:#fff7e6;padding:10px;border-radius:10px;font-size:11px">Charte: tenue decente, pas de gros mot, pas d eclaircissant<br><b>${TM}</b> membres vont te voir</div><video id=liveVid2 class=liveVideo autoplay muted playsinline></video><div id=liveStatus2></div>`,x:'<button onclick="startLive2()" style="width:100%;padding:12px;background:#b8965a;color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:10px">Lancer Live Maintenant 🔴</button>'},post:{t:'📝 Nouveau Post Blanc Or',m:()=>`<textarea id=newPost style="width:100%;min-height:80px;padding:12px;border:1.5px solid #efdfbe;border-radius:12px" placeholder="Quoi de neuf sous charte sainte?"></textarea><div style="font-size:9px;color:#6b7280;margin-top:6px">Blanc Or • Pas de monde • Eclaircissant = BAN</div>`,x:'<button onclick="publishPost()" style="width:100%;padding:12px;background:linear-gradient(135deg,#c9a86a,#b8965a);color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:10px">Publier en Blanc Or ✈️</button>'},ale:{t:'🚨 Alerte Citoyenne - Flottant',m:()=>`<div style="font-size:11px">${TA} alertes. Bouton flottant comme dans ta capture.<br><br></div><input id=ai style="width:100%;padding:12px;border:1.5px solid #fecaca;border-radius:12px" placeholder="Lieu + besoin ex: Marche sicogi">`,x:'<button onclick="sa()" style="width:100%;padding:13px;background:#dc2626;color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:10px">🚨 Envoyer ALERTE</button>'},mesh:{t:'🕸️ Mesh - Hors ligne',m:()=>'Mode Mesh actif: 3 personnes a proximite. Messages hors ligne synchronises.'},pro:{t:'👤 CANAA-OS Blanc Or',m:()=>`<div style="background:linear-gradient(135deg,#fff,#fdf6e3);border:1.5px solid #efdfbe;padding:14px;border-radius:14px"><b style="color:#7a5e33">CANAA-OS v1.0 Blanc Or</b><br><span style="font-size:11px">11 eglises<br>Compteur: ${TM} • Alertes: ${TA}<br>Style: WhatsApp + Instagram<br>Bouton ALERT flottant actif ✅</span></div>`}};
function om(k){let d=D[k];if(!d)return;document.getElementById('mt').innerHTML=d.t;document.getElementById('mx').innerHTML=typeof d.m=='function'?d.m():d.m;document.getElementById('ex').innerHTML=d.x||'';document.getElementById('mo').classList.add('op');}
function cm(){document.getElementById('mo').classList.remove('op');}
async function startLive(){let v=document.getElementById('liveVid'),s=document.getElementById('liveStatus');try{let st=await navigator.mediaDevices.getUserMedia({video:true,audio:true});v.srcObject=st;v.style.display='block';if(s)s.innerHTML='🔴 LIVE ACTIF Blanc Or';window._s=st;}catch(e){if(s)s.innerHTML='❌ Camera refusee';}}
async function startLive2(){let v=document.getElementById('liveVid2'),s=document.getElementById('liveStatus2');try{let st=await navigator.mediaDevices.getUserMedia({video:true,audio:true});v.srcObject=st;if(s)s.innerHTML='🔴 EN DIRECT - '+TM+' membres';window._s=st;}catch(e){if(s)s.innerHTML='❌ Camera refusee';}}
function sa(){let v=document.getElementById('ai');let t=v?v.value.trim():'';if(!t){alert('Ecris alerte');return}TA++;localStorage.setItem('canaa_alertes',TA);document.getElementById('mt').innerHTML='✅ Alerte Envoyee';document.getElementById('mx').innerHTML=`"${t}" → 11 eglises notifiees`;document.getElementById('ex').innerHTML='';}
function publishPost(){let v=document.getElementById('newPost');let t=v?v.value.trim():'';if(!t){alert('Ecris quelque chose');return}if(t.toLowerCase().includes('eclaircissant')||t.toLowerCase().includes('tchaa')){alert('❌ Interdit → BAN');return}posts.unshift({user:'Toi',loc:'Maintenant',time:'',img:'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600',likes:'0',com:'0',share:'0',cap:t,reply:''});renderFeed();cm();window.scrollTo({top:200,behavior:'smooth'});}
renderStories();renderFeed();
</script></body></html>
